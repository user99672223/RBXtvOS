name: sdk-evidence

# Evidence sources 2 and 3 (see CLAUDE.md): the tvOS SDK whose major version
# matches the device, and the iOS SDK Roblox was built against.
#
# Runner choice is evidence, so it is recorded rather than assumed:
#   tvOS  -> xcode-27  (macOS 27.0.1, Xcode 27.2, tvOS SDK 27.2) which matches
#            the device's tvOS 27.2 exactly.
#   iOS   -> macos-26  (Xcode 26.3, iOS SDK 26.2) which matches Roblox's own
#            DTSDKName=iphoneos26.2 / DTXcode=26.3. The xcode-27 image carries
#            only Xcode 27.x, so it cannot supply iOS SDK 26.2.
# The SDK *version* is selected on, not the Xcode version, because which SDK a
# given Xcode ships differs per image.
#
# Only derived text is committed (symbol lists, availability annotations,
# header excerpts). No Apple SDK files and no Roblox files leave the runner.
#
# Expressions use `github.event.inputs.*`, not `inputs.*`: the `inputs` context
# does not exist for a `push` event and referencing it fails workflow parsing
# for every trigger.

on:
  workflow_dispatch:
    inputs:
      tvos_runner:
        description: 'Runner label for the tvOS SDK job'
        default: 'xcode-27'
      tvos_sdk_version:
        description: 'tvOS SDK version to select (blank = highest on the image)'
        default: '27.2'
      ios_runner:
        description: 'Runner label for the iOS SDK job'
        default: 'macos-26'
      ios_sdk_version:
        description: 'iOS SDK version to select (blank = highest on the image)'
        default: '26.2'
      outputs_branch:
        description: 'Branch to commit derived evidence to'
        default: 'outputs'
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/sdk-evidence.yml'
      - 'scripts/runner/sdk_evidence.py'
      - 'scripts/runner/tbd.py'
      - 'scripts/runner/select_xcode.sh'
      - 'scripts/runner/commit_outputs.sh'
      - 'evidence/queries/sdk_query.json'
      - 'evidence/queries/ios_targets.json'
      - 'evidence/queries/header_targets.json'
      - 'evidence/queries/ios_header_targets.json'

permissions:
  contents: write

jobs:
  tvos:
    runs-on: ${{ github.event.inputs.tvos_runner || 'xcode-27' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select the tvOS SDK
        run: |
          set -euo pipefail
          chmod +x scripts/runner/select_xcode.sh
          DEV=$(scripts/runner/select_xcode.sh appletvos \
                "${{ github.event.inputs.tvos_sdk_version || '27.2' }}")
          echo "DEVELOPER_DIR=$DEV" >> "$GITHUB_ENV"
      - name: Record environment
        run: |
          mkdir -p evidence/sdk
          {
            echo "## tvOS SDK runner (evidence source 2)"
            echo
            echo '```'
            echo "runner label: ${{ github.event.inputs.tvos_runner || 'xcode-27' }}"
            echo "image version: ${ImageVersion:-unknown}"
            sw_vers
            echo "arch: $(uname -m)"
            xcodebuild -version
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            echo "--- appletvos ---"
            echo "sdk-path:    $(xcrun --sdk appletvos --show-sdk-path 2>&1)"
            echo "sdk-version: $(xcrun --sdk appletvos --show-sdk-version 2>&1)"
            echo "sdk-build:   $(xcrun --sdk appletvos --show-sdk-build-version 2>&1)"
            echo "--- every Xcode and tvOS SDK on this image ---"
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              v=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | head -1)
              s=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -showsdks 2>/dev/null \
                   | grep -oE 'appletvos[0-9.]+' | sort -u -V | tr '\n' ' ')
              echo "$app: $v  [$s]"
            done
            echo '```'
          } > evidence/sdk/tvos_environment.md
          cat evidence/sdk/tvos_environment.md
      - name: Extract tvOS SDK evidence
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk appletvos --show-sdk-path)
          VER=$(xcrun --sdk appletvos --show-sdk-version)
          echo "tvOS SDK $VER at $SDK"
          python3 -m pip install --quiet --break-system-packages pyyaml 2>/dev/null \
            || python3 -m pip install --quiet pyyaml 2>/dev/null || true
          python3 scripts/runner/sdk_evidence.py tvos "$SDK" "tvos${VER}"
          echo "TVOS_LABEL=tvos${VER}" >> "$GITHUB_ENV"
      - name: Commit derived evidence
        run: |
          chmod +x scripts/runner/commit_outputs.sh
          ./scripts/runner/commit_outputs.sh \
            "${{ github.event.inputs.outputs_branch || 'outputs' }}" \
            "sdk-evidence: tvOS SDK ${TVOS_LABEL}" \
            evidence/exports evidence/sdk

  ios:
    runs-on: ${{ github.event.inputs.ios_runner || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select the iOS SDK
        run: |
          set -euo pipefail
          chmod +x scripts/runner/select_xcode.sh
          DEV=$(scripts/runner/select_xcode.sh iphoneos \
                "${{ github.event.inputs.ios_sdk_version || '26.2' }}")
          echo "DEVELOPER_DIR=$DEV" >> "$GITHUB_ENV"
      - name: Record environment
        run: |
          mkdir -p evidence/sdk
          {
            echo "## iOS SDK runner (evidence source 3)"
            echo
            echo '```'
            echo "runner label: ${{ github.event.inputs.ios_runner || 'macos-26' }}"
            echo "image version: ${ImageVersion:-unknown}"
            sw_vers
            xcodebuild -version
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            echo "--- iphoneos ---"
            echo "sdk-path:    $(xcrun --sdk iphoneos --show-sdk-path 2>&1)"
            echo "sdk-version: $(xcrun --sdk iphoneos --show-sdk-version 2>&1)"
            echo "sdk-build:   $(xcrun --sdk iphoneos --show-sdk-build-version 2>&1)"
            echo "--- every Xcode and iOS SDK on this image ---"
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              v=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | head -1)
              s=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -showsdks 2>/dev/null \
                   | grep -oE 'iphoneos[0-9.]+' | sort -u -V | tr '\n' ' ')
              echo "$app: $v  [$s]"
            done
            echo '```'
          } > evidence/sdk/ios_environment.md
          cat evidence/sdk/ios_environment.md
      - name: Extract iOS SDK evidence
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $VER at $SDK"
          python3 -m pip install --quiet --break-system-packages pyyaml 2>/dev/null \
            || python3 -m pip install --quiet pyyaml 2>/dev/null || true
          TARGETS=""
          if [ -f evidence/queries/ios_targets.json ]; then TARGETS=evidence/queries/ios_targets.json; fi
          python3 scripts/runner/sdk_evidence.py ios "$SDK" "ios${VER}" $TARGETS
          echo "IOS_LABEL=ios${VER}" >> "$GITHUB_ENV"
      - name: Commit derived evidence
        run: |
          chmod +x scripts/runner/commit_outputs.sh
          ./scripts/runner/commit_outputs.sh \
            "${{ github.event.inputs.outputs_branch || 'outputs' }}" \
            "sdk-evidence: iOS SDK ${IOS_LABEL}" \
            evidence/exports evidence/sdk
