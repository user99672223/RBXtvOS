name: device-evidence

# Evidence source 1: the device's own system libraries, from the dyld shared
# cache in Apple's OTA for AppleTV14,1 at the target tvOS build.
#
# This has to run on macOS 27. tvOS 27.x OTAs compress their payloadv2 members
# with LZRaven (pbzm); ipsw has no decoder of its own and shells out to Apple's
# `aa`, whose LZRaven support arrived in macOS 27. Measured, not assumed:
#   macos-26 (macOS 26.6.2) -> aa rejects an LZRaven sample, Error 0xbd035000
#   xcode-27 (macOS 27.0.1) -> `aa archive -a lzraven` round-trips, lzraven OK
# So this runs on xcode-27. The session downloads nothing here and only fetches
# the derived text back from the outputs branch.
#
# Only export lists, install names and re-export edges are committed. The OTA
# and the cache stay on the runner (CLAUDE.md "Hard data rules").
#
# Triggering: `workflow_dispatch` only reaches workflows that exist on the
# repository's default branch, which this project cannot change (the session's
# GitHub proxy refuses repository settings writes). So the run is instead
# driven by a committed request file, evidence/queries/device_request.json,
# which also keeps every run's parameters under version control. Bump its
# "nonce" and push to ask for another run.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner label (needs macOS 27 for LZRaven)'
        default: ''
      device:
        description: 'Device identifier'
        default: ''
      tvos_build:
        description: 'tvOS build (blank = whatever the request file says)'
        default: ''
      tvos_version:
        description: 'tvOS version (blank = whatever the request file says)'
        default: ''
      dyld_arch:
        description: 'dyld_shared_cache architecture'
        default: ''
      outputs_branch:
        description: 'Branch to commit derived evidence to'
        default: ''
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/device-evidence.yml'
      - 'scripts/runner/device_evidence.py'
      - 'evidence/queries/device_request.json'

permissions:
  contents: write

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.c.outputs.runner }}
      device: ${{ steps.c.outputs.device }}
      tvos_build: ${{ steps.c.outputs.tvos_build }}
      tvos_version: ${{ steps.c.outputs.tvos_version }}
      dyld_arch: ${{ steps.c.outputs.dyld_arch }}
      outputs_branch: ${{ steps.c.outputs.outputs_branch }}
      enabled: ${{ steps.c.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        name: Merge dispatch inputs over the committed request
        env:
          IN_RUNNER: ${{ github.event.inputs.runner }}
          IN_DEVICE: ${{ github.event.inputs.device }}
          IN_BUILD: ${{ github.event.inputs.tvos_build }}
          IN_VERSION: ${{ github.event.inputs.tvos_version }}
          IN_ARCH: ${{ github.event.inputs.dyld_arch }}
          IN_BRANCH: ${{ github.event.inputs.outputs_branch }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          p = pathlib.Path('evidence/queries/device_request.json')
          req = json.loads(p.read_text()) if p.is_file() else {}
          def pick(env, key, default=''):
              v = os.environ.get(env) or ''
              return v or str(req.get(key, default) or default)
          print(f"runner={pick('IN_RUNNER','runner','xcode-27')}")
          print(f"device={pick('IN_DEVICE','device','AppleTV14,1')}")
          print(f"tvos_build={pick('IN_BUILD','tvos_build')}")
          print(f"tvos_version={pick('IN_VERSION','tvos_version')}")
          print(f"dyld_arch={pick('IN_ARCH','dyld_arch','arm64e')}")
          print(f"outputs_branch={pick('IN_BRANCH','outputs_branch','outputs')}")
          print(f"enabled={str(req.get('enabled', True)).lower()}")
          PY
          cat "$GITHUB_OUTPUT"

  device:
    needs: config
    if: needs.config.outputs.enabled == 'true'
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Record environment
        run: |
          mkdir -p evidence/sdk
          {
            echo "## device-evidence runner (evidence source 1)"
            echo
            echo '```'
            echo "runner label: ${{ needs.config.outputs.runner }}"
            echo "image version: ${ImageVersion:-unknown}"
            sw_vers
            echo "aa: $(which aa || echo 'NOT FOUND')"
            otool -L "$(which aa)" 2>/dev/null | head -5 || true
            echo '```'
          } > evidence/sdk/device_environment.md
          cat evidence/sdk/device_environment.md

      - name: Install ipsw
        run: |
          brew install blacktop/tap/ipsw
          ipsw version || true

      - name: Resolve the OTA
        id: resolve
        env:
          DEVICE: ${{ needs.config.outputs.device }}
          WANT_BUILD: ${{ needs.config.outputs.tvos_build }}
          WANT_VER: ${{ needs.config.outputs.tvos_version }}
        run: |
          set -euo pipefail
          ARGS=(--platform tvos --device "$DEVICE" --json)
          if [ -n "$WANT_BUILD" ]; then ARGS+=(--build "$WANT_BUILD"); fi
          if [ -n "$WANT_VER" ]; then ARGS+=(--version "$WANT_VER"); fi
          if [ -z "$WANT_BUILD" ] && [ -z "$WANT_VER" ]; then ARGS+=(--latest); fi
          ipsw download ota "${ARGS[@]}" > /tmp/ota.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open('/tmp/ota.json'))
          # the full SoftwareUpdate asset is the one holding the shared cache;
          # RecoveryOS is a minimal system and delta assets are patches only
          full = [o for o in d['otas']
                  if o['provenance']['asset_type'] == 'com.apple.MobileAsset.SoftwareUpdate'
                  and o['delivery'] == 'full']
          assert full, 'no full SoftwareUpdate OTA found'
          full.sort(key=lambda o: o.get('download_size') or 0, reverse=True)
          o = full[0]
          print(f"url={o['url']}")
          print(f"build={o['build']}")
          print(f"version={o['version']}")
          print(f"sha256={o['sha256']}")
          print(f"size={o['download_size']}")
          PY
          echo "--- resolved ---"; cat "$GITHUB_OUTPUT"

      - name: Download the OTA
        run: |
          set -euo pipefail
          URL='${{ steps.resolve.outputs.url }}'
          EXPECT='${{ steps.resolve.outputs.sha256 }}'
          SIZE='${{ steps.resolve.outputs.size }}'
          mkdir -p /tmp/ota
          for i in 1 2 3 4 5 6 7 8; do
            CUR=$(stat -f%z /tmp/ota/asset.aea 2>/dev/null || echo 0)
            if [ "$CUR" -ge "$SIZE" ]; then break; fi
            echo "attempt $i: have $CUR / $SIZE"
            curl -fsSL -C - -o /tmp/ota/asset.aea "$URL" || true
            sleep $((i * 3))
          done
          ACTUAL=$(shasum -a 256 /tmp/ota/asset.aea | awk '{print $1}')
          echo "expected $EXPECT"; echo "actual   $ACTUAL"
          [ "$EXPECT" = "$ACTUAL" ] || { echo "::error::OTA sha256 mismatch"; exit 1; }
          ls -lh /tmp/ota/

      - name: Extract the dyld shared cache
        env:
          ARCH: ${{ needs.config.outputs.dyld_arch }}
        run: |
          set -euo pipefail
          # decrypt the AppleEncryptedArchive wrapper (key comes from Apple)
          ipsw fw aea /tmp/ota/asset.aea -o /tmp/ota/dec
          ls -lh /tmp/ota/dec/
          OTA=$(ls /tmp/ota/dec/* | head -1)
          ipsw ota info "$OTA" | tee evidence/sdk/device_ota_info.txt
          mkdir -p /tmp/dsc
          ipsw ota extract "$OTA" --dyld --dyld-arch "$ARCH" --confirm --output /tmp/dsc
          echo "--- extracted ---"
          find /tmp/dsc -type f -name 'dyld_shared_cache*' | head -40
          df -h /

      - name: Dump device export lists
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pyyaml 2>/dev/null \
            || python3 -m pip install --quiet pyyaml 2>/dev/null || true
          CACHE=$(find /tmp/dsc -type f -name 'dyld_shared_cache_*' ! -name '*.*' | head -1)
          if [ -z "$CACHE" ]; then
            CACHE=$(find /tmp/dsc -type f -name 'dyld_shared_cache_*' | sort | head -1)
          fi
          echo "using cache: $CACHE"
          python3 scripts/runner/device_evidence.py "$CACHE" '${{ steps.resolve.outputs.build }}'

      - name: Commit derived evidence
        run: |
          ./scripts/runner/commit_outputs.sh \
            '${{ needs.config.outputs.outputs_branch }}' \
            'device-evidence: tvOS ${{ steps.resolve.outputs.version }} (${{ steps.resolve.outputs.build }}) ${{ needs.config.outputs.device }}' \\
            evidence/exports evidence/sdk evidence/device_queries
